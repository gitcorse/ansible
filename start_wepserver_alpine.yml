---
- name: remove nmap
  hosts: alpine
  gather_facts: false
  become: true
  tasks:
    - name: remove apache2
      package:
        name: apache2
        state: absent
      ignore_errors: true


#    - name: update repo
#      package:
#        #update_cache: true


    - name: install apache2
      package:
        name: apache2
        state: latest

    - name: start apache2 service
      service:
        name: apache2
        state: started



    - name: copy file to /var/www/localhost/htdocs/index.html
      copy:
        src: main.php
        dest: /var/www/localhost/htdocs/index.html
        owner: root
        group: root
        mode: '0644'
    - name: Stop Apache
      service:
        name: apache2
        state: reloaded
  